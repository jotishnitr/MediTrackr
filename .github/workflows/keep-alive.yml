name: Render Keep-Alive Cron

on:
  schedule:
    # Runs every 14 minutes to prevent Render from sleeping after 15 mins of inactivity
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MediTrackr Render Server
        run: |
          echo "Pinging https://meditrackr.onrender.com/ping..."
          curl -s -f -m 60 https://meditrackr.onrender.com/ping || echo "Ping request finished"
